services:
  postgres:
    image: postgres:latest
    container_name: first-app-test-postgres
    ports: 
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: first_app_test_db
    volumes: 
      - pgdata:/var/lib/postgresql

volumes:
  pgdata: